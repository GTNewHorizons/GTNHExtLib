# ExampleMod tag to use as Blowdryer (Spotless, etc.) settings version, leave empty to disable.
# LOCAL to test local config updates.
gtnh.settings.blowdryerTag = 0.2.0

# Human-readable mod name, available for mcmod.info population.
modName = GTNHExtLib

# Case-sensitive identifier string, available for mcmod.info population and used for automatic mixin JSON generation.
# Conventionally lowercase.
modId = gtnhextlib

# Root package of the mod, used to find various classes in other properties,
# mcmod.info substitution, enabling assertions in run tasks, etc.
modGroup = com.gtnewhorizons.gtnhextlib

# Whether to use modGroup as the maven publishing group.
# When false, com.github.GTNewHorizons is used.
useModGroupForPublishing = false

# Updates your build.gradle and settings.gradle automatically whenever an update is available.
autoUpdateBuildScript = false

# Version of Minecraft to target
minecraftVersion = 1.7.10

# Version of Minecraft Forge to target
forgeVersion = 10.13.4.1614

# Specify an MCP channel for dependency deobfuscation and the deobfParams task.
channel = stable

# Specify an MCP mappings version for dependency deobfuscation and the deobfParams task.
mappingsVersion = 12

# Defines other MCP mappings for dependency deobfuscation.
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# Select a default username for testing your mod.
developmentEnvironmentUserName = Developer

# Enables modern Java syntax support. Valid values:
# - false: No modern syntax, Java 8 only
# - jabel: Jabel syntax-only support, compiles to J8 bytecode
# - jvmDowngrader: Full modern Java via JVM Downgrader (syntax + stdlib APIs)
# - modern: Native modern Java bytecode, no downgrading
enableModernJavaSyntax = jabel

# Specifies how JVM Downgrader API stubs are provided.
# ExtLib ships the jvmdg-api jars as deploader-managed deps, but does not itself USE jvmdg.
jvmDowngraderStubsProvider = external

# Enables injecting missing generics into the decompiled source code for a better coding experience.
enableGenericInjection = true

# Generate a class with a String field for the mod version.
generateGradleTokenClass = com.gtnewhorizons.gtnhextlib.Tags

# Name of the token containing the project's current version to generate/replace.
gradleTokenVersion = VERSION

# [DEPRECATED] Mod ID replacement token.
gradleTokenModId =

# [DEPRECATED] Mod name replacement token.
gradleTokenModName =

# [DEPRECATED] Mod Group replacement token.
gradleTokenGroupName =

# [DEPRECATED]
replaceGradleTokenInFile =

# In case your mod provides an API for other mods to implement you may declare its package here.
apiPackage =

# Specify the configuration file for Forge's access transformers here.
accessTransformersFile =

# Provides setup for Mixins if enabled.
usesMixins = false

# Mixin source set placement.
separateMixinSourceSet =

# Adds some debug arguments like verbose output and class export.
usesMixinDebug = false

# Specify the location of your implementation of IMixinConfigPlugin. Leave it empty otherwise.
mixinPlugin =

# Specify the package that contains all of your Mixins.
mixinsPackage =

# Specify the core mod entry class. This class must implement IFMLLoadingPlugin.
coreModClass = core.GTNHExtLibCore

# This mod is a coremod + RFB plugin shell with no @Mod-only behaviour besides marker registration.
containsMixinsAndOrCoreModOnly = false

# Enables Mixins even if this mod doesn't use them.
forceEnableMixins = false

# If enabled, you may use 'shadowCompile' for dependencies. Used to relocate the deploader_stub.
usesShadowedDependencies = true

# If disabled, won't remove unused classes from shadowed dependencies.
minimizeShadowedDependencies = false

# Renames the shadowed deploader_stub classes under com.gtnewhorizons.gtnhextlib.shadow.*
relocateShadowedDependencies = true

# Adds CurseMaven, Modrinth, and some more well-known 1.7.10 repositories.
includeWellKnownRepositories = true

# A list of repositories to exclude from the includeWellKnownRepositories setting.
excludeWellKnownRepositories =

# Disabled because ExtLib needs two classifier-distinguished publications (slim + fat).
# DIY publishing block in build.gradle.kts owns publication registration.
usesMavenPublishing = false

# Maven repository to publish the mod to.
# mavenPublishUrl = https\://nexus.gtnewhorizons.com/repository/releases/

# The project's ID on Modrinth. Leave empty until first listing.
modrinthProjectId =

# The project's relations on Modrinth.
modrinthRelations =

# The project's numeric ID on CurseForge. Leave empty until first listing.
curseForgeProjectId =

# The project's relations on CurseForge.
curseForgeRelations =

# Optional parameter to have the build automatically fail if an illegal version is used.
versionPattern = \\d+\\.\\d+\\.\\d+(-pre|-snapshot)?

# Disable Checkstyle wildcard import check.
disableCheckstyle = true

# Non-GTNH properties
org.gradle.configuration-cache = true
org.gradle.parallel = true
